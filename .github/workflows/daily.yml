name: daily-weather
on:
  schedule:
    - cron: "0 12 * * *"      # 12:00 UTC = 7:00 AM Central Daylight Time
  workflow_dispatch: {}        # adds a manual "Run workflow" button
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python make_video.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python upload_youtube.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out.mp4
            caption.txt
