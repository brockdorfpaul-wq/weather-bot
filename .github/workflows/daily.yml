name: daily-weather
on:
  schedule:
    - cron: "0 12 * * *"      # morning: 7:00 AM Central (daylight time)
    - cron: "0 23 * * *"      # evening: 6:00 PM Central (daylight time)
  workflow_dispatch: {}        # adds a manual "Run workflow" button
permissions:
  contents: write              # lets the bot save video_log.csv back to the repo
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python make_video.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python upload_youtube.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Save video log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_log.csv
          git commit -m "Log new video" || echo "Nothing to save"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out.mp4
            caption.txt
