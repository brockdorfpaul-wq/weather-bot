name: week-in-weather
on:
  schedule:
    - cron: "0 16 * * 0"      # Sundays, 11:00 AM Central (daylight time)
  workflow_dispatch: {}        # adds a manual "Run workflow" button
permissions:
  contents: write              # lets the bot save weekly_log.csv back to the repo
concurrency:
  group: weekly-recap
  cancel-in-progress: false
jobs:
  recap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - run: pip install -r requirements.txt
      - run: python weekly_recap.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Save weekly log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_log.csv
          git commit -m "Log Week in Weather" || echo "Nothing to save"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            echo "Push failed, retrying"; sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: week-in-weather
          path: |
            recap.mp4
            recap_thumb.png
