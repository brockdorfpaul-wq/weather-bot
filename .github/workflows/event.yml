name: big-event-updates
on:
  schedule:
    - cron: "0 17 * * *"      # 12:00 PM Central (daylight time): extra update only if a big event is happening
    - cron: "0 20 * * *"      # 3:00 PM Central (daylight time): extra update only if a big event is happening
  workflow_dispatch: {}        # adds a manual "Run workflow" button
permissions:
  contents: write              # lets the bot save video_log.csv back to the repo
concurrency:
  group: video-log       # one job at a time per group, so log saves never collide
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - run: pip install -r requirements.txt
      - run: python make_video.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_ONLY: "1"
          VIDEO_MODE: "morning"
      - run: python upload_youtube.py
        if: hashFiles('out.mp4') != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Save video log
        if: hashFiles('out.mp4') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_log.csv
          git commit -m "Log big-event update" || echo "Nothing to save"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            echo "Push failed, retrying"; sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('out.mp4') != ''
        with:
          name: event-video
          path: |
            out.mp4
            caption.txt
