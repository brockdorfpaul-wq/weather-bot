name: weekly-learning
on:
  schedule:
    - cron: "0 15 * * 0"      # Sundays, 10:00 AM Central (daylight time)
  workflow_dispatch: {}        # adds a manual "Run workflow" button
permissions:
  contents: write              # lets the bot save its results back to the repo
jobs:
  learn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python learn.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learned_settings.json performance_report.md
          git commit -m "Weekly learning update" || echo "Nothing to save"
          git pull --rebase
          git push
