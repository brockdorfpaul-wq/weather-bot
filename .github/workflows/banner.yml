name: seasonal-banner
on:
  schedule:
    - cron: "0 14 1 * *"      # 1st of every month; only uploads when the season has changed
  workflow_dispatch: {}        # running it by hand always uploads the current season's banner
permissions:
  contents: write              # lets the bot save banner_state.json back to the repo
concurrency:
  group: banner
  cancel-in-progress: false
jobs:
  banner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python banner.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE_BANNER: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Save banner state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner_state.json 2>/dev/null || true
          git commit -m "Seasonal banner update" || echo "Nothing to save"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            echo "Push failed, retrying"; sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('banner.jpg') != ''
        with:
          name: banner
          path: banner.jpg
